---
version: 3

# All npm operations run inside the pinned `node:<.nvmrc>-alpine` image so the
# Node/npm version is identical for every developer and CI, regardless of what
# is installed on the host. The container runs as the calling user and reuses
# the host npm cache, so generated files stay owned by you.

vars:
  USER_ID:
    sh: id -u
  GROUP_ID:
    sh: id -g
  HOME:
    sh: echo $HOME
  VERSION:
    sh: cat .nvmrc

tasks:
  command:
    internal: true
    vars:
      COMMAND: '{{default "install" .COMMAND}}'
    cmds:
      - |-
        docker run --rm -i \
          -v $PWD:/app \
          -v /etc/group:/etc/group:ro \
          -v /etc/passwd:/etc/passwd:ro \
          -v /etc/shadow:/etc/shadow:ro \
          -v {{.HOME}}/.npm:/tmp/.npm \
          --workdir=/app \
          -e NPM_CONFIG_CACHE=/tmp/.npm \
          --user {{.USER_ID}}:{{.GROUP_ID}} \
          --network=host \
          node:{{.VERSION}}-alpine \
            npm {{.COMMAND}}

  default:
    desc: Run an arbitrary npm command in the Node image. Example `task npm -- help`
    summary: |
      Run an arbitrary npm command inside the Node Docker image.

      Used for installing packages, updating packages, ...
      Examples:
      * `task npm -- install <package name>`
      * `task npm -- update`
      * `task npm -- ls <package name>`
      * `task npm -- ci`
    cmds:
      - task: command
        vars: { COMMAND: "{{.CLI_ARGS}}" }

  ci:
    desc: Install dependencies from the lockfile (npm ci).
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "ci" }

  install:
    desc: Install all dependencies defined for npm.
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "install" }

  build:
    desc: Build the production bundle.
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "run build" }

  lint:
    desc: Run ESLint over the code base.
    interactive: true
    vars:
      FILES: '{{default "." .CLI_ARGS}}'
    cmds:
      - task: command
        vars: { COMMAND: "run lint -- {{.FILES}}" }

  lint:fix:
    desc: Run ESLint and automatically fix errors.
    interactive: true
    vars:
      FILES: '{{default "." .CLI_ARGS}}'
    cmds:
      - task: command
        vars: { COMMAND: "run lint:fix -- {{.FILES}}" }

  format:
    desc: Format the code base with Prettier.
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "run format" }

  format:check:
    desc: Check formatting with Prettier without writing changes.
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "run format:check" }

  typecheck:
    desc: Type-check the code base with vue-tsc.
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "run typecheck" }

  test:
    desc: Run all unit tests.
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "run test" }

  test:update:
    desc: Run all tests in update mode (refresh snapshots).
    interactive: true
    cmds:
      - task: command
        vars: { COMMAND: "run test:update" }
